<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" font-family="sans-serif">
<rect x="5" y="5" width="890" height="410" fill="none" stroke="#888" stroke-dasharray="6,4" stroke-width="2"/>
<text x="20" y="28" font-size="14" fill="#555">localhost trust boundary (127.0.0.1) — messages authenticated + integrity-checked, not encrypted</text>
<rect x="40" y="30" width="220" height="90" rx="8" fill="#eef4ff" stroke="#3366cc" stroke-width="2"/>
<text x="150" y="60" font-size="17" text-anchor="middle" font-weight="bold">Client</text>
<text x="150" y="85" font-size="13" text-anchor="middle" fill="#333">Ed25519 identity</text>
<text x="150" y="103" font-size="13" text-anchor="middle" fill="#333">submits job.request</text>
<rect x="40" y="230" width="220" height="90" rx="8" fill="#eef4ff" stroke="#3366cc" stroke-width="2"/>
<text x="150" y="260" font-size="17" text-anchor="middle" font-weight="bold">Planner</text>
<text x="150" y="285" font-size="13" text-anchor="middle" fill="#333">splits job, aggregates</text>
<text x="150" y="303" font-size="13" text-anchor="middle" fill="#333">127.0.0.1:19001</text>
<rect x="330" y="230" width="220" height="90" rx="8" fill="#eef4ff" stroke="#3366cc" stroke-width="2"/>
<text x="440" y="260" font-size="17" text-anchor="middle" font-weight="bold">Worker</text>
<text x="440" y="285" font-size="13" text-anchor="middle" fill="#333">computes partial sums</text>
<text x="440" y="303" font-size="13" text-anchor="middle" fill="#333">127.0.0.1:19002</text>
<rect x="620" y="230" width="220" height="90" rx="8" fill="#eef4ff" stroke="#3366cc" stroke-width="2"/>
<text x="730" y="260" font-size="17" text-anchor="middle" font-weight="bold">Auditor</text>
<text x="730" y="285" font-size="13" text-anchor="middle" fill="#333">recomputes + verifies</text>
<text x="730" y="303" font-size="13" text-anchor="middle" fill="#333">127.0.0.1:19003</text>
<line x1="150" y1="75" x2="150" y2="275" stroke="#3366cc" stroke-width="2" marker-end="url(#arrow)"/>
<text x="150" y="167" font-size="12" text-anchor="middle" fill="#222">job.request / job.request.reply</text>
<line x1="150" y1="275" x2="440" y2="275" stroke="#3366cc" stroke-width="2" marker-end="url(#arrow)"/>
<text x="295" y="267" font-size="12" text-anchor="middle" fill="#222">task.assign x2 / task.assign.reply x2</text>
<line x1="150" y1="275" x2="730" y2="275" stroke="#3366cc" stroke-width="2" marker-end="url(#arrow)"/>
<text x="440" y="267" font-size="12" text-anchor="middle" fill="#222">audit.request / audit.request.reply</text>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#3366cc"/></marker></defs>
<text x="20" y="400" font-size="13" fill="#555">Every arrow is a signed JSON envelope (Ed25519, RFC 8032); receivers verify signature, sender, recipient, type and sequence number.</text>
</svg>
